<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Income Life - Meeting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        /* Slideshow Container */
        .slideshow-container {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay Content */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Logo Container */
        .logo-container {
            background: white;
            padding: 2.5rem 4rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 650px;
            margin-bottom: 2rem;
        }

        .logo-container img {
            max-width: 450px;
            width: 100%;
            height: auto;
            margin-bottom: 1.5rem;
        }

        .logo-container h1 {
            color: #1e3c72;
            font-size: 2rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .logo-container p {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 0;
        }

        /* Countdown */
        .countdown-container {
            background: rgba(30, 60, 114, 0.95);
            color: white;
            padding: 2.5rem 4rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            min-width: 350px;
        }

        .countdown-label {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            opacity: 0.95;
            font-weight: 500;
        }

        .countdown {
            font-size: 5rem;
            font-weight: 700;
            color: #ffd700;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .status-message {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            opacity: 0.85;
        }

        /* Loading Animation */
        .loading-dots {
            display: inline-block;
            margin-left: 0.5rem;
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .logo-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .logo-container img {
                max-width: 280px;
            }

            .logo-container h1 {
                font-size: 1.5rem;
            }

            .logo-container p {
                font-size: 1rem;
            }

            .countdown {
                font-size: 3.5rem;
            }

            .countdown-container {
                padding: 2rem 2rem;
                margin: 0 1rem;
                min-width: auto;
            }

            .countdown-label {
                font-size: 1.1rem;
            }

            .status-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Slideshow Background -->
    <div class="slideshow-container" id="slideshow">
        <div class="slide active">
            <img src="slide1.png" alt="Slide 1">
        </div>
        <div class="slide">
            <img src="slide2.png" alt="Slide 2">
        </div>
        <div class="slide">
            <img src="slide3.png" alt="Slide 3">
        </div>
        <div class="slide">
            <img src="slide4.png" alt="Slide 4">
        </div>
        <div class="slide">
            <img src="slide5.png" alt="Slide 5">
        </div>
    </div>

    <!-- Overlay Content -->
    <div class="overlay">
        <div class="logo-container">
            <img id="meeting-logo" src="" alt="Meeting Logo">
            <h1 id="meeting-title">Please Wait</h1>
            <p id="meeting-message">Your representative will start the meeting soon</p>
        </div>

        <div class="countdown-container">
            <div class="countdown-label">Meeting starts in</div>
            <div class="countdown" id="countdown">00:00</div>
            <div class="status-message">
                Preparing meeting room<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const meetingId = getUrlParameter('meeting');
        const meetingType = getUrlParameter('type') || 'standard';
        const waitTime = parseInt(getUrlParameter('wait')) || 10; // seconds to wait

        // Meeting type configurations
        const meetingTypes = {
            csk: {
                logo: 'csk.png',
                title: 'Child Safe Kit Presentation',
                message: 'Your representative will start the meeting soon'
            },
            hardcard: {
                logo: 'hardcard.png',
                title: 'Union Member Benefits',
                message: 'Your union representative will be with you shortly'
            },
            ailplus: {
                logo: 'ailplus.png',
                title: 'AIL Plus Coverage Review',
                message: 'Your benefits specialist will join shortly'
            },
            willkit: {
                logo: 'willkit.png',
                title: 'Estate Planning Session',
                message: 'Your estate planning advisor will be right with you'
            },
            referral: {
                logo: 'referral.png',
                title: 'Referral Program Discussion',
                message: 'Thank you for your referral! Your agent will join shortly'
            },
            standard: {
                logo: 'standard.png',
                title: 'American Income Life Meeting',
                message: 'Your representative will start the meeting soon'
            }
        };

        // Get current meeting type config
        const config = meetingTypes[meetingType] || meetingTypes.standard;

        // Set logo and text
        document.getElementById('meeting-logo').src = config.logo;
        document.getElementById('meeting-title').textContent = config.title;
        document.getElementById('meeting-message').textContent = config.message;

        // Slideshow functionality
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Change slide every 5 seconds
        setInterval(showNextSlide, 5000);

        // Countdown functionality
        let timeLeft = waitTime;
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                // Redirect to Jitsi
                if (meetingId) {
                    const sanitizedId = meetingId.replace(/[^a-zA-Z0-9-_]/g, '');
                    window.location.href = `https://meet.jit.si/AmericanIncome-${sanitizedId}`;
                }
            } else {
                timeLeft--;
            }
        }

        // Update countdown every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // If no meeting ID, show error
        if (!meetingId) {
            document.querySelector('.status-message').innerHTML = '<span style="color: #ff6b6b;">⚠️ No meeting ID provided</span>';
        }
    </script>
</body>
</html>

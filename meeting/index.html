<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Income Life - Meeting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        /* Slideshow Container */
        .slideshow-container {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        /* Overlay Content */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Logo Container */
        .logo-container {
            background: white;
            padding: 2rem 4rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .logo-container img {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 1.5rem;
        }

        .logo-container h1 {
            color: #1e3c72;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .logo-container p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        /* Countdown */
        .countdown-container {
            background: rgba(30, 60, 114, 0.95);
            color: white;
            padding: 2rem 3rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .countdown-label {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .countdown {
            font-size: 4rem;
            font-weight: 700;
            color: #ffd700;
            font-variant-numeric: tabular-nums;
        }

        .status-message {
            margin-top: 1rem;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* Loading Animation */
        .loading-dots {
            display: inline-block;
            margin-left: 0.5rem;
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .logo-container {
                padding: 1.5rem 2rem;
                margin: 1rem;
            }

            .logo-container img {
                max-width: 250px;
            }

            .logo-container h1 {
                font-size: 1.4rem;
            }

            .logo-container p {
                font-size: 1rem;
            }

            .countdown {
                font-size: 3rem;
            }

            .countdown-container {
                padding: 1.5rem 2rem;
                margin: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Slideshow Background -->
    <div class="slideshow-container" id="slideshow"></div>

    <!-- Overlay Content -->
    <div class="overlay">
        <div class="logo-container">
            <img id="meeting-logo" src="" alt="Meeting Logo">
            <h1 id="meeting-title">Please Wait</h1>
            <p id="meeting-message">Your representative will start the meeting soon</p>
        </div>

        <div class="countdown-container">
            <div class="countdown-label">Meeting starts in</div>
            <div class="countdown" id="countdown">00:00</div>
            <div class="status-message">
                Preparing meeting room<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const meetingId = getUrlParameter('meeting');
        const meetingType = getUrlParameter('type') || 'standard';
        const waitTime = parseInt(getUrlParameter('wait')) || 10; // seconds to wait

        // Meeting type configurations
        const meetingTypes = {
            csk: {
                logo: 'csk.png',
                title: 'Child Safe Kit Presentation',
                message: 'Your representative will start the meeting soon',
                backgrounds: [
                    'https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=1920', // Office meeting
                    'https://images.unsplash.com/photo-1497366216548-37526070297c?w=1920', // Professional workspace
                    'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?w=1920', // Team collaboration
                    'https://images.unsplash.com/photo-1553877522-43269d4ea984?w=1920', // Modern office
                    'https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=1920'  // Business meeting
                ]
            },
            hardcard: {
                logo: 'hardcard.png',
                title: 'Union Member Benefits',
                message: 'Your union representative will be with you shortly',
                backgrounds: [
                    'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1920', // Union workers
                    'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1920', // Industrial setting
                    'https://images.unsplash.com/photo-1541746972996-4e0b0f43e02a?w=1920', // Teamwork
                    'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1920', // Professional office
                    'https://images.unsplash.com/photo-1552664730-d307ca884978?w=1920'  // Group discussion
                ]
            },
            ailplus: {
                logo: 'ailplus.png',
                title: 'AIL Plus Coverage Review',
                message: 'Your benefits specialist will join shortly',
                backgrounds: [
                    'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=1920', // Professional consultation
                    'https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=1920', // Business discussion
                    'https://images.unsplash.com/photo-1560250097-0b93528c311a?w=1920', // Office meeting
                    'https://images.unsplash.com/photo-1542744173-05336fcc7ad4?w=1920', // Team meeting
                    'https://images.unsplash.com/photo-1556761175-4b46a572b786?w=1920'  // Professional workspace
                ]
            },
            willkit: {
                logo: 'willkit.png',
                title: 'Estate Planning Session',
                message: 'Your estate planning advisor will be right with you',
                backgrounds: [
                    'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=1920', // Professional documents
                    'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=1920', // Legal consultation
                    'https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=1920', // Business professional
                    'https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=1920', // Office environment
                    'https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=1920'  // Consultation
                ]
            },
            referral: {
                logo: 'referral.png',
                title: 'Referral Program Discussion',
                message: 'Thank you for your referral! Your agent will join shortly',
                backgrounds: [
                    'https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=1920', // Friendly meeting
                    'https://images.unsplash.com/photo-1600880292089-90a7e086ee0c?w=1920', // Handshake
                    'https://images.unsplash.com/photo-1556761175-5973dc0f32e7?w=1920', // Team collaboration
                    'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?w=1920', // Professional setting
                    'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1920'  // Team success
                ]
            },
            standard: {
                logo: 'standard.png',
                title: 'American Income Life Meeting',
                message: 'Your representative will start the meeting soon',
                backgrounds: [
                    'https://images.unsplash.com/photo-1497366216548-37526070297c?w=1920', // Office
                    'https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=1920', // Professional
                    'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?w=1920', // Meeting
                    'https://images.unsplash.com/photo-1553877522-43269d4ea984?w=1920', // Modern office
                    'https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=1920'  // Collaboration
                ]
            }
        };

        // Get current meeting type config
        const config = meetingTypes[meetingType] || meetingTypes.standard;

        // Set logo and text
        document.getElementById('meeting-logo').src = config.logo;
        document.getElementById('meeting-title').textContent = config.title;
        document.getElementById('meeting-message').textContent = config.message;

        // Create slideshow
        const slideshowContainer = document.getElementById('slideshow');
        config.backgrounds.forEach((url, index) => {
            const slide = document.createElement('div');
            slide.className = 'slide' + (index === 0 ? ' active' : '');
            slide.innerHTML = `<img src="${url}" alt="Background ${index + 1}">`;
            slideshowContainer.appendChild(slide);
        });

        // Slideshow functionality
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Change slide every 5 seconds
        setInterval(showNextSlide, 5000);

        // Countdown functionality
        let timeLeft = waitTime;
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                // Redirect to Jitsi
                if (meetingId) {
                    const sanitizedId = meetingId.replace(/[^a-zA-Z0-9-_]/g, '');
                    window.location.href = `https://meet.jit.si/AmericanIncome-${sanitizedId}`;
                }
            } else {
                timeLeft--;
            }
        }

        // Update countdown every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // If no meeting ID, show error
        if (!meetingId) {
            document.querySelector('.status-message').innerHTML = '<span style="color: #ff6b6b;">⚠️ No meeting ID provided</span>';
        }
    </script>
</body>
</html>

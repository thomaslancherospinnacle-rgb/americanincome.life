<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Income Life - Meeting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #jitsi-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .no-meeting {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .no-meeting h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .no-meeting p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.6;
        }

        .no-meeting code {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
        }

        .example-links {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .example-links a {
            background: white;
            color: #1e3c72;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: transform 0.2s;
        }

        .example-links a:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .no-meeting h1 {
                font-size: 1.5rem;
            }

            .no-meeting p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="meeting-container"></div>

    <script>
        // Get URL parameter
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Get meeting name from URL
        const meetingName = getUrlParameter('meeting');

        if (meetingName) {
            // Sanitize meeting name
            const sanitizedName = meetingName.replace(/[^a-zA-Z0-9-_]/g, '');
            
            // Create Jitsi iframe URL
            const jitsiUrl = `https://meet.jit.si/${sanitizedName}`;
            
            // Create and insert iframe
            const iframe = document.createElement('iframe');
            iframe.id = 'jitsi-iframe';
            iframe.src = jitsiUrl;
            iframe.allow = 'camera; microphone; fullscreen; display-capture; autoplay';
            iframe.allowFullscreen = true;
            
            document.getElementById('meeting-container').appendChild(iframe);
            
            // Update page title
            document.title = `Meeting: ${sanitizedName}`;
        } else {
            // Show instructions if no meeting parameter
            document.getElementById('meeting-container').innerHTML = `
                <div class="no-meeting">
                    <h1>🎥 American Income Life - Video Meetings</h1>
                    <p>
                        To start or join a meeting, add <code>?meeting=YourMeetingName</code> to the URL.
                    </p>
                    <p style="margin-top: 1rem;">
                        Example: <code>www.americanincome.life/jitsi.html?meeting=Thomaslancherosail</code>
                    </p>
                    <div class="example-links">
                        <a href="?meeting=TeamMeeting">Join Team Meeting</a>
                        <a href="?meeting=Training">Join Training Room</a>
                        <a href="?meeting=SupportCall">Join Support Call</a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>

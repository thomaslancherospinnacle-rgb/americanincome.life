<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AmericanIncome Meeting</title>
  <style>
    body{font-family:system-ui,Arial;margin:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
    video{width:min(520px,100%);background:#000;border-radius:12px}
    button{padding:10px 12px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .muted{color:#555}
    code{background:#f3f3f3;padding:2px 6px;border-radius:8px}
  </style>
</head>
<body>
  <h2>WebRTC Meeting</h2>
  <div class="row">
    Room: <code id="room"></code>
    <span class="muted" id="status">Idle</span>
  </div>

  <div class="row">
    <button id="start">Start Camera</button>
    <button id="hang" disabled>Hang Up</button>
  </div>

  <div class="row">
    <div>
      <div class="muted">Local</div>
      <video id="local" autoplay playsinline muted></video>
    </div>
    <div>
      <div class="muted">Remote</div>
      <video id="remote" autoplay playsinline></video>
    </div>
  </div>

<script>
  // ============================
  // 1) PASTE YOUR APPS SCRIPT URL
  // ============================
  const SIGNAL_API = "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";

  // Link format: /meeting.html?=ROOMID
  function getRoomId() {
    const s = location.search || "";
    if (s.startsWith("?=")) return s.slice(2).trim();
    const u = new URL(location.href);
    return (u.searchParams.get("room") || "").trim();
  }
  const roomId = (getRoomId().replace(/[^a-zA-Z0-9_-]/g,"").slice(0,64)) || "demo";
  document.getElementById("room").textContent = roomId;

  const statusEl = document.getElementById("status");
  const setStatus = (t)=> statusEl.textContent = t;

  const btnStart = document.getElementById("start");
  const btnHang  = document.getElementById("hang");
  const vLocal   = document.getElementById("local");
  const vRemote  = document.getElementById("remote");

  const peerId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).replace(/[^a-zA-Z0-9_-]/g,"").slice(0,12);
  let lastTs = 0;
  let pollTimer = null;

  let pc = null;
  let localStream = null;
  let remoteStream = null;
  let makingOffer = false;

  const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];

  async function api(action, params) {
    const u = new URL(SIGNAL_API);
    u.searchParams.set("action", action);
    for (const [k,v] of Object.entries(params||{})) u.searchParams.set(k, v);
    const res = await fetch(u.toString(), { cache: "no-store" });
    return await res.json();
  }

  async function joinRoom() {
    const r = await api("join", { room: roomId, peer: peerId });
    if (!r.ok) throw new Error(r.error || "join_failed");
  }

  async function sendSig(type, payload) {
    const r = await api("put", { room: roomId, from: peerId, type, payload });
    if (!r.ok) throw new Error(r.error || "put_failed");
  }

  async function poll() {
    const r = await api("get", { room: roomId, since: String(lastTs), to: peerId });
    if (!r.ok) return;

    const msgs = r.msgs || [];
    for (const m of msgs) {
      lastTs = Math.max(lastTs, Number(m.ts || 0));
      await onSignalMessage(m.type, m.payload, m.from);
    }
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(poll, 1200); // 1.2s polling (simple + stable)
  }

  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  function ensurePC() {
    if (pc) return pc;

    pc = new RTCPeerConnection({ iceServers });
    remoteStream = new MediaStream();
    vRemote.srcObject = remoteStream;

    pc.ontrack = (ev) => {
      ev.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
    };

    pc.onicecandidate = (ev) => {
      if (ev.candidate) {
        // Send each candidate as it appears
        sendSig("candidate", JSON.stringify(ev.candidate)).catch(()=>{});
      }
    };

    pc.onconnectionstatechange = () => {
      setStatus("Peer: " + pc.connectionState);
    };

    pc.onnegotiationneeded = async () => {
      try {
        makingOffer = true;
        await pc.setLocalDescription(await pc.createOffer());
        await sendSig("description", JSON.stringify(pc.localDescription));
        setStatus("Offer sent, waiting…");
      } finally {
        makingOffer = false;
      }
    };

    // add local tracks if already available
    if (localStream) {
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    }

    return pc;
  }

  async function onSignalMessage(type, payload) {
    const pc = ensurePC();

    if (type === "description") {
      const desc = JSON.parse(payload);

      const offerCollision = (desc.type === "offer") && (makingOffer || pc.signalingState !== "stable");
      if (offerCollision) return;

      await pc.setRemoteDescription(desc);

      if (desc.type === "offer") {
        await pc.setLocalDescription(await pc.createAnswer());
        await sendSig("description", JSON.stringify(pc.localDescription));
        setStatus("Answer sent, connecting…");
      }
      return;
    }

    if (type === "candidate") {
      try {
        const cand = JSON.parse(payload);
        await pc.addIceCandidate(cand);
      } catch {}
      return;
    }

    if (type === "reset") {
      hangUp();
      return;
    }
  }

  async function startCameraAndConnect() {
    if (!SIGNAL_API || SIGNAL_API.includes("PASTE_")) {
      alert("You must paste your Google Apps Script Web App URL into SIGNAL_API.");
      return;
    }

    setStatus("Requesting camera/mic…");
    localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    vLocal.srcObject = localStream;

    setStatus("Joining room…");
    await joinRoom();

    setStatus("Connecting…");
    ensurePC();

    // Start polling after peer is ready
    startPolling();

    btnStart.disabled = true;
    btnHang.disabled = false;

    setStatus("Waiting for other side…");
  }

  async function hangUp() {
    stopPolling();

    try { if (pc) pc.close(); } catch {}
    pc = null;

    if (remoteStream) {
      remoteStream.getTracks().forEach(t => t.stop());
      remoteStream = null;
    }
    vRemote.srcObject = null;

    setStatus("Hung up");
    btnStart.disabled = false;
    btnHang.disabled = true;
  }

  btnStart.onclick = async () => {
    try { await startCameraAndConnect(); }
    catch (e) {
      console.error(e);
      alert("Failed. Check your Apps Script URL + deployment access set to Anyone.");
      setStatus("Failed");
      btnStart.disabled = false;
      btnHang.disabled = true;
    }
  };

  btnHang.onclick = async () => {
    try { await sendSig("reset", "1"); } catch {}
    await hangUp();
  };
</script>
</body>
</html>
